services:

  db:
    image: mysql:8.0
    container_name: quran-db

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: quran_db

    ports:
      - "3307:3306"

    volumes:
      - quran-db-data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  backend:
    build: ./backend
    container_name: quran-backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: quran_db
      JWT_SECRET: super_secret_quran_key_change_me_in_production

    depends_on:
      - db


  frontend:
    build: ./frontend
    container_name: quran-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:

  quran-db-data: